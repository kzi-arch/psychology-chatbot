[project]
name = "psikologi-chatbot"
version = "0.1.0"
description = "Chatbot Teman Curhat Psikologi - Gemini"
authors = [{ name = "zaki" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "tiktoken>=0.7.0",
    "structlog>=24.4.0",
    "chromadb>=1.5.9",
    "langchain>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.3",
    "langchain-text-splitters",
    "langchain-chroma",
    "streamlit>=1.57.0",
    "pysqlite3-binary; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
    "streamlit>=1.38.0",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "ruff",
    "streamlit>=1.57.0",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
